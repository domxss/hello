name: Zizmor 🌈

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: true

      - run: echo "${{ github.event.pull_request.head.ref }}"

      - name: Zizmor 🌈
        uses: zizmorcore/zizmor-action@main
